<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>किसान दृष्टि AI - Kisan Drishti AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-amber-50 min-h-screen text-stone-800 font-sans">
    <header class="bg-emerald-700 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🌾</span>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">किसान दृष्टि AI</h1>
                    <p class="text-xs text-emerald-200">जैविक व पारंपरिक कृषि समाधान</p>
                </div>
            </div>
            <select id="languageSelect" class="bg-emerald-800 border border-emerald-600 text-white text-sm rounded-lg px-2.5 py-1.5 focus:outline-none">
                <option value="hi" selected>हिंदी</option>
                <option value="bho">भोजपुरी</option>
                <option value="en">English</option>
                <option value="pa">ਪੰਜਾਬੀ</option>
                <option value="bn">বাংলা</option>
                <option value="mr">मराठी</option>
            </select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100">
            <h2 class="text-lg font-semibold text-emerald-900 mb-2">फसल की समस्या साझा करें</h2>
            <p class="text-sm text-stone-600 mb-4">पत्ती या रोग की फ़ोटो खींचें या बोलकर अपनी परेशानी बताएं।</p>
            
            <form id="analyzeForm" class="space-y-4">
                <div class="border-2 border-dashed border-emerald-300 rounded-xl p-4 text-center hover:bg-emerald-50/50 cursor-pointer relative" onclick="document.getElementById('imageInput').click()">
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
                    <div id="uploadPlaceholder">
                        <i class="fa-solid fa-camera text-3xl text-emerald-600 mb-2"></i>
                        <p class="text-sm font-medium text-stone-700">फोटो चुनें या सीधे कैमरा खोलें</p>
                    </div>
                    <img id="imagePreview" class="hidden max-h-56 mx-auto rounded-lg shadow-sm" alt="फसल प्रीव्यू">
                </div>

                <div class="relative">
                    <textarea id="queryText" rows="3" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none pr-12" placeholder="फसल में क्या दिक्कत दिख रही है? (उदा. पत्तियां पीली पड़ रही हैं...)"></textarea>
                    <button type="button" id="voiceBtn" onclick="toggleVoice()" class="absolute right-3 bottom-3 text-emerald-600 hover:text-emerald-700 p-2">
                        <i class="fa-solid fa-microphone text-xl" id="micIcon"></i>
                    </button>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl shadow-md transition duration-150 flex items-center justify-center space-x-2">
                    <span>जांच करें और समाधान पाएं</span>
                    <i class="fa-solid fa-seedling"></i>
                </button>
            </form>
        </div>

        <div id="loading" class="hidden bg-white p-6 rounded-2xl border border-emerald-100 shadow-sm text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent mb-3"></div>
            <p class="text-stone-700 font-medium">किसान दृष्टि AI विश्लेषण कर रहा है...</p>
        </div>

        <div id="resultCard" class="hidden bg-white p-6 rounded-2xl border border-emerald-100 shadow-sm space-y-3">
            <div class="flex items-center space-x-2 text-emerald-800">
                <i class="fa-solid fa-check-circle text-lg"></i>
                <h3 class="font-bold text-lg">सुझाव व उपचार</h3>
            </div>
            <div id="resultContent" class="text-stone-700 text-sm leading-relaxed whitespace-pre-line"></div>
        </div>
    </main>

    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('imagePreview');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        let recognition;
        function toggleVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("आपके ब्राउज़र में वॉइस टाइपिंग सपोर्ट नहीं है।");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!recognition) {
                recognition = new SpeechRecognition();
                recognition.lang = document.getElementById('languageSelect').value === 'en' ? 'en-IN' : 'hi-IN';
                recognition.onresult = function(event) {
                    document.getElementById('queryText').value = event.results[0][0].transcript;
                    document.getElementById('micIcon').classList.remove('text-red-600');
                };
                recognition.onerror = function() {
                    document.getElementById('micIcon').classList.remove('text-red-600');
                };
            }
            recognition.start();
            document.getElementById('micIcon').classList.add('text-red-600');
        }

        document.getElementById('analyzeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = document.getElementById('queryText').value.trim();
            const image = document.getElementById('imageInput').files[0];
            const language = document.getElementById('languageSelect').value;

            if (!text && !image) {
                alert("कृपया कोई सवाल लिखें या फ़सल की फ़ोटो अपलोड करें।");
                return;
            }

            const formData = new FormData();
            if (text) formData.append('query', text);
            if (image) formData.append('image', image);
            formData.append('language', language);

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultCard').classList.add('hidden');

            try {
                const res = await fetch('/api/analyze', { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('loading').classList.add('hidden');
                if (data.status === 'success') {
                    document.getElementById('resultContent').innerText = data.response_text;
                    document.getElementById('resultCard').classList.remove('hidden');
                } else {
                    alert(data.error || "जांच में त्रुटि आई।");
                }
            } catch (err) {
                document.getElementById('loading').classList.add('hidden');
                alert("सर्वर से संपर्क नहीं हो पाया।");
            }
        });
    </script>
</body>
</html>
